<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glitched Games">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>GLITCHED GAMES</title>
<style>
:root{--bg-color:#090a10;--card-bg:#131625;--accent-color:#00ffcc;--accent-pink:#ff007f;--text-color:#fff;--text-muted:#8e95b7}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:var(--bg-color);color:var(--text-color);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
#splash-screen{position:fixed;inset:0;background:radial-gradient(circle at center,#181b30 0%,#05060a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease;padding:20px;text-align:center}
.glitch-title{font-size:2.2rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--accent-color);text-shadow:2px 2px var(--accent-pink),-2px -2px #0088ff;margin-bottom:30px;line-height:1.2}
.enter-btn{padding:16px 40px;font-size:1.2rem;font-weight:800;color:#000;background:var(--accent-color);border:none;border-radius:30px;box-shadow:0 0 20px var(--accent-color);cursor:pointer;width:80%;max-width:280px}
.enter-btn:active{transform:scale(.95)}
header{background:rgba(19,22,37,.95);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(0,255,204,.2)}
.logo-bar{display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.4rem;font-weight:900;color:var(--accent-color);text-decoration:none}
.search-input{width:100%;padding:12px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.15);background:#090a10;color:#fff;font-size:.95rem;outline:none}.search-input:focus{border-color:var(--accent-color)}
.categories{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}
.cat-btn{background:var(--card-bg);color:var(--text-muted);border:1px solid rgba(255,255,255,.08);padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;white-space:nowrap}.cat-btn.active{background:var(--accent-color);color:#000;font-weight:800}
main{padding:12px 16px 30px;flex-grow:1}.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.game-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.game-card{background:var(--card-bg);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid rgba(255,255,255,.05);text-decoration:none;color:inherit}.game-card:active{transform:scale(.96);border-color:var(--accent-color)}
.card-thumb{font-size:2.2rem;margin-bottom:8px}.card-title{font-size:.85rem;font-weight:700;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-category{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;margin-top:2px}
.modal{display:none;position:fixed;inset:0;background:#000;z-index:1000;flex-direction:column;justify-content:space-between}.modal-header{padding:12px 16px;background:#131625;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1)}
.close-btn{color:var(--accent-pink);font-size:2rem;line-height:1;font-weight:bold}.game-viewport{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;position:relative;width:100%;overflow:hidden}
canvas{background:#05060a;border-radius:12px;border:1px solid rgba(0,255,204,.3);width:100%;max-width:340px;height:340px;touch-action:none}
.mobile-controls{padding:15px;background:#090a10;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}.dpad-row{display:flex;gap:8px}
.touch-btn{width:55px;height:55px;background:#131625;color:var(--accent-color);border:1px solid var(--accent-color);border-radius:12px;font-size:1.2rem;font-weight:bold;display:flex;align-items:center;justify-content:center}.touch-btn:active{background:var(--accent-color);color:#000}
.action-btn{width:100%;max-width:280px;height:50px;background:var(--accent-pink);color:#fff;border-radius:25px;border:none;font-size:1.1rem;font-weight:bold}.action-btn:active{transform:scale(.96)}
#installBtn{display:none;position:fixed;right:14px;bottom:14px;z-index:500;background:var(--accent-color);color:#000;border:0;border-radius:24px;padding:11px 16px;font-weight:900;box-shadow:0 0 18px rgba(0,255,204,.5)}
</style>
</head>
<body>
<div id="splash-screen">
<h1 class="glitch-title">Welcome To Glitched World</h1>
<button class="enter-btn" onclick="enterApp()">START GAMING</button>
</div>
<header><div class="logo-bar"><a href="#" class="logo">⚡ GLITCHED GAMES</a></div>
<input type="text" id="searchInput" class="search-input" placeholder="Search 50 mobile games..." onkeyup="filterGames()"></header>
<div class="categories">
<button class="cat-btn active" onclick="filterCategory('all',this)">All Games</button>
<button class="cat-btn" onclick="filterCategory('Action',this)">Action</button>
<button class="cat-btn" onclick="filterCategory('Arcade',this)">Arcade</button>
<button class="cat-btn" onclick="filterCategory('Puzzle',this)">Puzzle</button>
<button class="cat-btn" onclick="filterCategory('Reflex',this)">Reflex</button>
</div>
<main><div class="game-grid" id="gameGrid"></div></main>
<div class="modal" id="gameModal"><div class="modal-header"><h3 id="gameTitle" style="color:var(--accent-color)">Game</h3><span class="close-btn" onclick="closeGame()">&times;</span></div><div class="game-viewport" id="gameArea"></div><div class="mobile-controls" id="controlsArea"></div></div>
<button id="installBtn">📲 INSTALL APP</button>

<script>
const gamesList=[
{id:1,name:"Neon Snake",category:"Arcade",icon:"🐍",engine:"snake"},{id:2,name:"Flappy Glitch",category:"Action",icon:"🐦",engine:"flappy"},{id:3,name:"Space Defender",category:"Action",icon:"🚀",engine:"shooter"},{id:4,name:"Tap Target Master",category:"Reflex",icon:"🎯",engine:"target"},{id:5,name:"Brick Crusher",category:"Arcade",icon:"🧱",engine:"brick"},{id:6,name:"Speed Math Quiz",category:"Puzzle",icon:"🔢",engine:"math"},{id:7,name:"Tic Tac Toe AI",category:"Puzzle",icon:"❌",engine:"tictactoe"},{id:8,name:"Color Tap Rush",category:"Reflex",icon:"🎨",engine:"colortap"},{id:9,name:"10-Sec Speed Tap",category:"Action",icon:"👆",engine:"clicker"},{id:10,name:"Retro Pong Touch",category:"Arcade",icon:"🏓",engine:"pong"},{id:11,name:"Dodge The Meteor",category:"Action",icon:"☄️",engine:"meteor"},{id:12,name:"Memory Box Match",category:"Puzzle",icon:"🧠",engine:"memory"},{id:13,name:"Whack A Mole",category:"Reflex",icon:"🐹",engine:"whack"},{id:14,name:"Knife Throw Precision",category:"Action",icon:"🗡️",engine:"knife"},{id:15,name:"Fruit Slicer Touch",category:"Action",icon:"🍉",engine:"slicer"},{id:16,name:"Traffic Car Dodge",category:"Arcade",icon:"🏎️",engine:"car"},{id:17,name:"Tower Stack Jump",category:"Arcade",icon:"🏢",engine:"stack"},{id:18,name:"Simon Colors",category:"Puzzle",icon:"🔴",engine:"simon"},{id:19,name:"Coin Catcher Fall",category:"Arcade",icon:"🪙",engine:"coin"},{id:20,name:"Bomb Defuse Wire",category:"Puzzle",icon:"💣",engine:"bomb"},{id:21,name:"Pixel Platform Jump",category:"Action",icon:"🦘",engine:"jump"},{id:22,name:"Color Switch Tap",category:"Reflex",icon:"🌈",engine:"colorswitch"},{id:23,name:"Typing Reflex Test",category:"Reflex",icon:"⌨️",engine:"typing"},{id:24,name:"Maze Path Escape",category:"Puzzle",icon:"🧩",engine:"maze"},{id:25,name:"Circle Jumper",category:"Arcade",icon:"⭕",engine:"circlejump"},{id:26,name:"Number Guesser",category:"Puzzle",icon:"🔮",engine:"guessnum"},{id:27,name:"Reaction Timer",category:"Reflex",icon:"⏱️",engine:"reaction"},{id:28,name:"Gravity Drop Fall",category:"Arcade",icon:"🪂",engine:"gravity"},{id:29,name:"Dodge Wall Hazard",category:"Action",icon:"⚠️",engine:"hazard"},{id:30,name:"Moving Target Tap",category:"Reflex",icon:"🎯",engine:"movetarget"},{id:31,name:"Block Breaker 2D",category:"Puzzle",icon:"🟦",engine:"block2"},{id:32,name:"Speed Reflex Grid",category:"Reflex",icon:"⚡",engine:"reflexgrid"},{id:33,name:"Pattern Match Pro",category:"Puzzle",icon:"✨",engine:"pattern"},{id:34,name:"Word Guess Rush",category:"Puzzle",icon:"📝",engine:"word"},{id:35,name:"Paddle Balancer",category:"Arcade",icon:"⚖️",engine:"balancer"},{id:36,name:"Falling Star Catcher",category:"Arcade",icon:"⭐",engine:"star"},{id:37,name:"Cyber Blaster",category:"Action",icon:"🔫",engine:"cyber"},{id:38,name:"Endless Glitch Run",category:"Action",icon:"🏃",engine:"endless"},{id:39,name:"Color Match Grid",category:"Puzzle",icon:"🟩",engine:"colormatch"},{id:40,name:"Fast Tap Frenzy",category:"Reflex",icon:"🔥",engine:"frenzy"},{id:41,name:"Grid Number Tap",category:"Puzzle",icon:"🔢",engine:"gridtap"},{id:42,name:"Road Runner Glitch",category:"Arcade",icon:"🛣️",engine:"road"},{id:43,name:"Precision Circle Tap",category:"Reflex",icon:"📍",engine:"precision"},{id:44,name:"Memory Sequence",category:"Puzzle",icon:"🧠",engine:"memseq"},{id:45,name:"Dodge Master",category:"Action",icon:"🛡️",engine:"dodgemaster"},{id:46,name:"Pixel Glitch Hero",category:"Arcade",icon:"🕹️",engine:"pixelhero"},{id:47,name:"Speed Math Blitz",category:"Puzzle",icon:"➕",engine:"math2"},{id:48,name:"Tap Attack Boss",category:"Action",icon:"👾",engine:"boss"},{id:49,name:"Reflex Glitch Pro",category:"Reflex",icon:"⚡",engine:"reflexpro"},{id:50,name:"Final Survival 50",category:"Action",icon:"🏆",engine:"survival"}];
let currentCategory='all',currentGameLoop=null;
function enterApp(){const s=document.getElementById('splash-screen');s.style.opacity='0';setTimeout(()=>s.style.display='none',500)}
function renderGames(filterText=''){const grid=document.getElementById('gameGrid');grid.innerHTML='';gamesList.filter(g=>(currentCategory==='all'||g.category===currentCategory)&&g.name.toLowerCase().includes(filterText.toLowerCase())).forEach(game=>{const card=document.createElement('div');card.className='game-card';card.onclick=()=>launchGame(game);card.innerHTML=`<div class="card-thumb">${game.icon}</div><div class="card-title">${game.name}</div><div class="card-category">${game.category}</div>`;grid.appendChild(card)})}
function filterGames(){renderGames(document.getElementById('searchInput').value)}
function filterCategory(cat,btn){currentCategory=cat;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filterGames()}
function launchGame(game){document.getElementById('gameTitle').innerText=game.name;const a=document.getElementById('gameArea'),c=document.getElementById('controlsArea');a.innerHTML='';c.innerHTML='';document.getElementById('gameModal').style.display='flex';switch(game.engine){case'snake':loadSnakeEngine(a,c);break;case'flappy':loadFlappyEngine(a,c);break;case'shooter':loadShooterEngine(a,c);break;case'target':loadTargetEngine(a,c);break;case'clicker':loadClickerEngine(a,c);break;case'math':loadMathEngine(a,c);break;case'tictactoe':loadTicTacToeEngine(a,c);break;case'knife':loadKnifeEngine(a,c);break;default:loadTouchActionEngine(a,c,game.name)}}
function loadSnakeEngine(area,ctrl){area.innerHTML='<canvas id="c" width="300" height="300"></canvas>';ctrl.innerHTML='<div class="dpad-row"><button class="touch-btn" onclick="setDir(\'U\')">▲</button></div><div class="dpad-row"><button class="touch-btn" onclick="setDir(\'L\')">◀</button><button class="touch-btn" onclick="setDir(\'D\')">▼</button><button class="touch-btn" onclick="setDir(\'R\')">▶</button></div>';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let snake=[{x:150,y:150},{x:140,y:150}],dx=10,dy=0,food={x:80,y:80},score=0;window.setDir=d=>{if(d==='L'&&dx===0){dx=-10;dy=0}if(d==='R'&&dx===0){dx=10;dy=0}if(d==='U'&&dy===0){dx=0;dy=-10}if(d==='D'&&dy===0){dx=0;dy=10}};currentGameLoop=setInterval(()=>{let head={x:snake[0].x+dx,y:snake[0].y+dy};if(head.x<0||head.x>=300||head.y<0||head.y>=300){clearInterval(currentGameLoop);showGameOver(ctx,canvas,score,()=>loadSnakeEngine(area,ctrl));return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;food={x:Math.floor(Math.random()*28+1)*10,y:Math.floor(Math.random()*28+1)*10}}else snake.pop();ctx.fillStyle='#05060a';ctx.fillRect(0,0,300,300);snake.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x+5,p.y+5,5,0,Math.PI*2);ctx.fillStyle=i===0?'#00ffcc':'#00b386';ctx.fill()});ctx.beginPath();ctx.arc(food.x+5,food.y+5,5,0,Math.PI*2);ctx.fillStyle='#ff007f';ctx.fill();ctx.fillStyle='#fff';ctx.fillText('Score: '+score,10,20)},90)}
function loadFlappyEngine(area,ctrl){area.innerHTML='<canvas id="c" width="300" height="300"></canvas>';ctrl.innerHTML='<button class="action-btn" onclick="jump()">TAP TO JUMP</button>';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let birdY=150,vel=0,pipes=[],score=0;window.jump=()=>vel=-6;canvas.onclick=window.jump;currentGameLoop=setInterval(()=>{vel+=.4;birdY+=vel;if(birdY>290||birdY<0){clearInterval(currentGameLoop);showGameOver(ctx,canvas,score,()=>loadFlappyEngine(area,ctrl));return}if(Math.random()<.03)pipes.push({x:300,top:Math.random()*120+30,gap:80});ctx.fillStyle='#05060a';ctx.fillRect(0,0,300,300);ctx.fillStyle='#ff007f';ctx.beginPath();ctx.arc(60,birdY,8,0,Math.PI*2);ctx.fill();pipes.forEach(p=>{p.x-=3;ctx.fillStyle='#00ffcc';ctx.fillRect(p.x,0,20,p.top);ctx.fillRect(p.x,p.top+p.gap,20,300);if(60>p.x&&60<p.x+20&&(birdY<p.top||birdY>p.top+p.gap)){clearInterval(currentGameLoop);showGameOver(ctx,canvas,score,()=>loadFlappyEngine(area,ctrl));return}if(p.x===57)score++});ctx.fillStyle='#fff';ctx.fillText('Score: '+score,10,20)},30)}
function loadShooterEngine(area,ctrl){area.innerHTML='<canvas id="c" width="300" height="300"></canvas>';ctrl.innerHTML='<div style="display:flex;gap:10px;width:100%;justify-content:center"><button class="touch-btn" style="width:80px" onclick="m(-20)">◀</button><button class="touch-btn" style="flex-grow:1;max-width:140px;background:var(--accent-pink);color:#fff" onclick="f()">FIRE 🔥</button><button class="touch-btn" style="width:80px" onclick="m(20)">▶</button></div>';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let sx=135,bullets=[],enemies=[],score=0;window.m=d=>sx=Math.max(0,Math.min(270,sx+d));window.f=()=>bullets.push({x:sx+12,y:260});currentGameLoop=setInterval(()=>{if(Math.random()<.05)enemies.push({x:Math.random()*270,y:0});ctx.fillStyle='#05060a';ctx.fillRect(0,0,300,300);ctx.fillStyle='#00ffcc';ctx.fillRect(sx,265,30,15);bullets.forEach(b=>{b.y-=7;ctx.fillStyle='#fff';ctx.fillRect(b.x,b.y,4,8)});enemies.forEach((e,ei)=>{e.y+=2;ctx.fillStyle='#ff007f';ctx.fillRect(e.x,e.y,20,20);if(e.y>280){clearInterval(currentGameLoop);showGameOver(ctx,canvas,score,()=>loadShooterEngine(area,ctrl));return}bullets.forEach((b,bi)=>{if(b.x>e.x&&b.x<e.x+20&&b.y>e.y&&b.y<e.y+20){enemies.splice(ei,1);bullets.splice(bi,1);score+=10}})});ctx.fillStyle='#fff';ctx.fillText('Score: '+score,10,20)},30)}
function loadTargetEngine(area,ctrl){area.innerHTML='<canvas id="c" width="300" height="300"></canvas>';ctrl.innerHTML='<p style="color:var(--text-muted);font-size:.9rem">Tap on targets quickly!</p>';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let target={x:150,y:150,r:22},score=0;canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;if(Math.hypot(mx-target.x,my-target.y)<target.r){score+=10;target.x=Math.random()*240+30;target.y=Math.random()*240+30}};currentGameLoop=setInterval(()=>{ctx.fillStyle='#05060a';ctx.fillRect(0,0,300,300);ctx.beginPath();ctx.arc(target.x,target.y,target.r,0,Math.PI*2);ctx.fillStyle='#ff007f';ctx.fill();ctx.fillStyle='#fff';ctx.fillText('Score: '+score,10,20)},30)}
function loadClickerEngine(area,ctrl){let c=0,time=10;area.innerHTML='<h2 style="color:var(--accent-pink);font-size:1.5rem">Time: <span id="tm">10</span>s</h2><h1 style="color:var(--accent-color);font-size:3rem;margin:20px 0"><span id="ck">0</span></h1>';ctrl.innerHTML='<button class="action-btn" id="tapBtn">TAP FAST!</button>';let tmr=setInterval(()=>{time--;document.getElementById('tm').innerText=time;if(time<=0){clearInterval(tmr);alert("Time's Up! Total Score: "+c);loadClickerEngine(area,ctrl)}},1000);document.getElementById('tapBtn').onclick=()=>{if(time>0){c++;document.getElementById('ck').innerText=c}}}
function loadMathEngine(area,ctrl){let a=Math.floor(Math.random()*15)+1,b=Math.floor(Math.random()*15)+1,ans=a+b;area.innerHTML=`<h1 style="color:var(--accent-color);font-size:2.5rem;margin-top:30px">${a} + ${b} = ?</h1>`;ctrl.innerHTML='<input type="number" id="mAns" style="padding:10px;font-size:1.3rem;width:120px;text-align:center;border-radius:10px;border:1px solid var(--accent-color);background:#131625;color:#fff"><button class="action-btn" style="margin-top:10px" onclick="checkM()">SUBMIT</button>';window.checkM=()=>{let v=parseInt(document.getElementById('mAns').value);if(v===ans){alert('Correct!');loadMathEngine(area,ctrl)}else alert('Wrong Answer!')}}
function loadTicTacToeEngine(area,ctrl){let b=["","","","","","","","",""],t="X";area.innerHTML='<h3 id="st" style="color:var(--accent-color);margin-bottom:15px">Turn: X</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:240px;height:240px">'+b.map((_,i)=>`<div style="background:#131625;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;cursor:pointer" onclick="clk(${i})"></div>`).join('')+'</div>';window.clk=i=>{let cells=area.querySelectorAll('div > div');if(!b[i]){b[i]=t;cells[i].innerText=t;t=t==='X'?'O':'X';document.getElementById('st').innerText=`Turn: ${t}`}}}
function loadKnifeEngine(area,ctrl){area.innerHTML='<canvas id="c" width="300" height="300"></canvas>';ctrl.innerHTML='<button class="action-btn" onclick="throwKnife()">THROW KNIFE 🗡️</button>';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let angle=0,knifeY=260,isThrowing=false,score=0;window.throwKnife=()=>{if(!isThrowing)isThrowing=true};currentGameLoop=setInterval(()=>{angle+=.05;if(isThrowing){knifeY-=15;if(knifeY<=120){score+=10;isThrowing=false;knifeY=260}}ctx.fillStyle='#05060a';ctx.fillRect(0,0,300,300);ctx.save();ctx.translate(150,90);ctx.rotate(angle);ctx.beginPath();ctx.arc(0,0,35,0,Math.PI*2);ctx.fillStyle='#00ffcc';ctx.fill();ctx.restore();ctx.fillStyle='#ff007f';ctx.fillRect(146,knifeY,8,25);ctx.fillStyle='#fff';ctx.fillText('Score: '+score,10,20)},30)}
function loadTouchActionEngine(area,ctrl,name){area.innerHTML='<canvas id="c" width="300" height="300"></canvas>';ctrl.innerHTML='<button class="action-btn" onclick="touchAct()">ACTION TAP</button>';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let score=0,px=135,py=135;window.touchAct=()=>{score+=5;px=Math.random()*230+20;py=Math.random()*230+20};currentGameLoop=setInterval(()=>{ctx.fillStyle='#05060a';ctx.fillRect(0,0,300,300);ctx.fillStyle='#00ffcc';ctx.beginPath();ctx.arc(px+15,py+15,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText(name,10,25);ctx.fillText('Score: '+score,10,50)},30)}
function showGameOver(ctx,canvas,score,restartCallback){ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff007f';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,130);ctx.fillStyle='#00ffcc';ctx.font='16px sans-serif';ctx.fillText('Score: '+score,canvas.width/2,170);canvas.onclick=()=>{canvas.onclick=null;restartCallback()}}
function closeGame(){if(currentGameLoop)clearInterval(currentGameLoop);document.getElementById('gameModal').style.display='none'}
renderGames();

let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
